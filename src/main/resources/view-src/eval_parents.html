<!DOCTYPE html>

<html>

<head>
    <title>{{#i18n}}evaluations.title{{/i18n}}</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1" />
    
    <script src="/assets/js/entcore/ng-app.js?v=@@VERSION" id="context" type="text/javascript"></script>
    <script type="text/javascript" src="/competences/public/dist/parents.js?v=@@VERSION"></script>
    <script type="text/ng-template" id="empty"></script>
    <link rel="stylesheet" href="/competences/public/css/competences.css?v=@@VERSION">
    <style>
    /*
      Bandeau d'invitation à la nouvelle IHM React. Styles posés ici, dans la vue de l'ancienne
      IHM, pour n'avoir rien à retirer d'ailleurs le jour où elle disparaît.
      Teintes neutres assumées : la feuille de cette IHM n'expose pas les jetons `--openent-*`
      du socle, et deviner les siens donnerait un rendu faux sur certains thèmes.
    */
    .competences-ui-switch {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 9000;
        max-width: calc(100vw - 32px);
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #243242;
        color: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
        font-size: 14px;
    }
    .competences-ui-switch[hidden] { display: none; }
    .competences-ui-switch-text { display: flex; flex-direction: column; gap: 2px; }
    .competences-ui-switch-text span { opacity: .8; }
    .competences-ui-switch-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .competences-ui-switch-actions button {
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
        background: transparent;
        color: #fff;
        text-decoration: underline;
    }
    .competences-ui-switch-actions button.primary {
        background: #fff;
        color: #243242;
        font-weight: 600;
        text-decoration: none;
    }
    @media (max-width: 600px) {
        .competences-ui-switch { flex-direction: column; align-items: stretch; gap: 12px; }
    }
    </style>
</head>

<body ng-controller="EvaluationsController" class="evaluations vsco--global">
<portal class="eval_parent">
    <c-fil-ariane></c-fil-ariane>
    <container class="twelve cell twelve-mobile" template="header"></container>
    <container class="two cell" template="menu"></container>
    <container class="cell twelve-mobile"
               ng-class="{twelve : template.isEmpty('menu'),ten : !template.isEmpty('menu')}"
               template="main">
    </container>
</portal>
<lightbox show="showNoteLightBox.bool" class="lightbox-parent" on-close="showNoteLightBox.bool=false">
    <container template="lightboxContainer"></container>
</lightbox>

<message-loader display="opened.displayMessageLoader">
</message-loader>
<!--
  Invitation à essayer la nouvelle IHM React. Rendue ici en HTML plutôt que construite en
  JavaScript : les libellés passent par la balise i18n du gabarit, dans un contexte HTML — le
  seul que le moteur de gabarit échappe correctement (les textes français portent des
  apostrophes). Hors du portail et en position fixe : aucune interaction avec la mise en page
  AngularJS. Masquée par défaut ; c'est ui-switch.js qui décide de l'afficher, d'après la
  préférence usager.
-->
<div id="competences-ui-switch" class="competences-ui-switch" hidden>
    <div class="competences-ui-switch-text">
        <strong>{{#i18n}}competences.switch.invitation.title{{/i18n}}</strong>
        <span>{{#i18n}}competences.switch.invitation.body.famille{{/i18n}}</span>
    </div>
    <div class="competences-ui-switch-actions">
        <button type="button" data-action="later">{{#i18n}}competences.switch.invitation.later{{/i18n}}</button>
        <button type="button" data-action="try" class="primary">{{#i18n}}competences.switch.invitation.try{{/i18n}}</button>
    </div>
</div>
<script type="text/javascript" src="/competences/public/ui-switch.js?v=@@VERSION"></script>
</body>
</html>
